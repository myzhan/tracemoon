name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
        with:
          # jemalloc is intentionally disabled; no recursive third-party fetch is needed.
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential liblzma-dev libunwind-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build pinned Lua and skynet test vendors and ABI fixtures
        run: bash tests/build-vendor.sh

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests with both Lua allocator fixtures
        env:
          TRACEMOON_HEAP_FIXTURE: ${{ github.workspace }}/target/test-vendor/heap-fixture
          TRACEMOON_SKYNET_HEAP_FIXTURE: ${{ github.workspace }}/target/test-vendor/heap-fixture-skynet
        run: cargo test --all-targets

      - name: cargo build --release
        run: cargo build --release

  integration:
    name: Real Lua + skynet process capture (Linux)
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential liblzma-dev libunwind-dev gdb

      - uses: Swatinem/rust-cache@v2

      - name: Build pinned test vendors
        run: bash tests/build-vendor.sh

      # These tests invoke tracemoon's actual CLI and let it spawn its own targets,
      # preserving parent/child ptrace permission under Yama without sudo.
      # They are ignored only in the fast suite; this job always selects them explicitly.
      - name: CPU samples, heap captures, real ELF cores, service filters and offline reports
        run: cargo test --release --test integration -- --ignored --test-threads=1
