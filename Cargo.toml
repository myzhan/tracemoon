[package]
name = "tracemoon"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = {version="3.2", features=["wrap_help", "cargo", "derive"]}
clap_complete="3.2"
env_logger = "0.10"
remoteprocess = {version="0.5.0", features=["unwind"]}
chrono = "0.4.26"
libc = "0.2"
log = "0.4"
thiserror = "1"
memmap2 = "0.9"
ctrlc = "3"
proc-maps = "0.4"
read-process-memory = "0.1"
object = { version = "0.36", default-features = false, features = ["read", "elf", "macho", "std"] }
inferno = { version = "0.12", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["process", "ptrace", "signal"] }

[dev-dependencies]
tempfile = "3"